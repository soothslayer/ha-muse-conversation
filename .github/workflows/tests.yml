name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-test.txt
      - run: pytest -q
      - run: ruff check .
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          git clone https://github.com/facebookincubator/muse-gadget-sdk.git /tmp/muse-gadget-sdk
          cd /tmp/muse-gadget-sdk
          git checkout 3229892e93c18a768ace42cbe1fe7133f91ca203
          git apply --check "$GITHUB_WORKSPACE/bridge/musegadget-spoken-replies.patch"
          git apply "$GITHUB_WORKSPACE/bridge/musegadget-spoken-replies.patch"
          pip install -e ./linux pytest
          cd linux
          pytest -q
